  reason: no-developer-program
  detail: >-
    ID Planet's GitBook whitepaper advertises an EVM-compatible "ID Planet Chain", an "ID
    Explorer" block explorer and asset APIs "easily accessible to third-party developers", but
    names no RPC URL, chain ID, explorer host, SDK or specification anywhere across its sixteen
    published pages, and idplanet.io returns a hard 404 for /llms.txt, /openapi.json and every
    /.well-known/ path -- the only machine-readable document on any ID Planet host is the
    llms.txt GitBook emits automatically for the whitepaper space.
