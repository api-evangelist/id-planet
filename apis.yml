aid: id-planet
name: ID Planet
description: >-
  ID Planet is a Web3 GameFi company building an EVM-compatible blockchain ecosystem for
  blockchain gaming. Its published ecosystem spans ID Planet Chain, the ID Explorer block
  explorer, the ID Wallet multi-chain wallet, ID SWAP (a decentralized exchange), ID PLANETXC
  (a centralized exchange) and an NFT marketplace, alongside first-party game titles Infinitar
  (5v5 MOBA), Runesoul (ARPG) and CoolGods (MOBA). The $ID governance token is issued as a
  BEP20 asset on BNB Chain with a total supply of 7,800,000,000 and a mining/burn distribution
  model. Company material is published as a GitBook whitepaper in eight languages. As of
  2026-08-22 ID Planet publishes no developer portal, API reference, RPC endpoint, chain ID or
  machine-readable specification on any host it controls, so this profile is identity and
  documentation only.
